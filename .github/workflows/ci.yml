name: CI + Deploy to HuggingFace Space

# GitHub = single source of truth. HF Space = deployed runtime mirror.
# On every push to main: run privacy audit + lint/type gates + the hermetic
# test suite, then (only if all green) force-push the tree to the HF Space.
#
# Constraints enforced here:
# - Tests, lint (ruff check + format), and types (mypy) must pass before deploy.
# - Private artefacts (MEMORY/, docs/, EXECUTION_RULES.md, etc.) must not
#   be tracked in git. The privacy-audit job fails loudly if they are.
# - Deploy only fires on push to main, never on PRs (prevents accidental
#   production pushes from fork PRs).
# - HF_TOKEN is a GitHub repository secret (write-scoped HF token).
# - OPENAI_API_KEY and MONGODB_URI, WHEN USED, are configured on the HF Space
#   side (Space Settings → Variables and secrets), NOT in this workflow — and
#   neither is required: absent, the engine runs the deterministic LLM-absent /
#   in-memory path. The engine detects their presence at boot via
#   streamlit_app/app.py::detect_mode, VERIFIES a present OpenAI key actually
#   works (not just that it is set), and surfaces the real mode in the UI banner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly. Re-runs the gates against a live clock: pip-audit's verdict decays
    # as new advisories land on unchanged pins (a green push-only badge would
    # stay green over a newly-disclosed CVE), and space-health confirms the
    # public demo is still up. deploy-hf is push-gated, so nothing deploys here.
    - cron: "30 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Workflow-level permissions: minimal default. Individual jobs may upgrade
# (none do today — privacy-audit + test only read; deploy-hf authenticates
# to HuggingFace via HF_TOKEN secret, not GITHUB_TOKEN).
# Addresses CodeQL actions/missing-workflow-permissions (medium).
permissions:
  contents: read

env:
  HF_OWNER: MarwaBS
  HF_SPACE_NAME: job-decision-engine
  PYTHON_VERSION: "3.12"

jobs:
  privacy-audit:
    name: Privacy audit — no private artefacts in git
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Fail if private paths are tracked by git
        run: |
          set -euo pipefail
          PRIVATE_PATHS='^(MEMORY/|docs/|EXECUTION_RULES\.md$|AUDIT_STATE\.md$|CLAUDE\.md$|profile\.yaml$|profile\..*\.yaml$)'
          LEAKED=$(git ls-files | grep -E "$PRIVATE_PATHS" || true)
          if [ -n "$LEAKED" ]; then
            echo "::error::Private artefact(s) committed to git. Fix gitignore and rewrite history:"
            echo "$LEAKED"
            exit 1
          fi
          echo "✓ No private artefacts tracked. Safe to build."

  test:
    name: Unit tests (hermetic suite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # The lock constraint makes CI test the exact transitive universe the
      # Docker image installs (see requirements-lock.txt header).
      - name: Install pinned runtime + test deps (lock-constrained)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  lint:
    name: Lint + format + types (ruff, mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # Runtime deps are needed so mypy can resolve the lazy imports
      # (pymongo, openai, streamlit) instead of being silenced with
      # blanket ignore_missing_imports.
      - name: Install pinned runtime + dev tooling (lock-constrained)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c requirements-lock.txt -r requirements-dev.txt

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy

      # Audit the FULL locked dependency set — the exact universe the
      # Docker image installs — against known-vulnerability databases.
      # --no-deps: the lock is fully pinned; no re-resolution wanted.
      # The lock resolves starlette 1.3.1 (PYSEC-2026-248/249 fixed in
      # 1.3.0/1.3.1) and torch 2.12.1 (outside the CVE-2025-3000 affected
      # range; 2.12.0 was inside it — verified 2026-07-04). If a NEW advisory
      # lands this step goes red; never silence it without a dated, justified
      # --ignore-vuln here.
      #
      # PYSEC-2026-3447 (setuptools, disclosed 2026-07): a BUILD-TIME sdist bug
      # — MANIFEST.in exclude/prune globs skip Unicode normalization, so an
      # NFD-encoded filename on a macOS APFS/HFS+ checkout can slip past an NFC
      # exclusion when *creating a source distribution*. This service builds no
      # sdist, runs on Linux (python:3.12-slim-bookworm), and setuptools is a
      # build-time transitive of torch never invoked at request time — the
      # attack precondition cannot hold. The fix (>=83.0.0) is unreachable
      # anyway: torch 2.12.1 hard-pins `setuptools<82`. Revisit when torch
      # relaxes that cap so we can resolve a patched setuptools.
      #
      # PYSEC-2025-194 (torch, disclosed 2025): memory corruption reachable
      # through `torch.jit.script`; CVSS 4.8, and the vector requires local
      # user-level code execution. This repo calls no torch API at all —
      # `git grep "import torch"` over the source is empty; torch arrives only
      # as a sentence-transformers transitive for embeddings, and the JIT
      # scripting path is never entered. The fix (2.13.0) does not resolve
      # here: CI reported ResolutionImpossible against both the pinned
      # sentence-transformers 5.4.1 and 5.6.1 (two runs, 2026-07-31). Revisit
      # when the embedding stack resolves against torch >= 2.13.
      - name: pip-audit (locked dependency set)
        run: pip-audit -r requirements-lock.txt --no-deps --ignore-vuln PYSEC-2026-3447 --ignore-vuln PYSEC-2025-194

  deploy-hf:
    name: Deploy to HuggingFace Space
    runs-on: ubuntu-latest
    needs: [privacy-audit, test, lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - name: Checkout with full history (needed for push)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate HF_TOKEN secret is configured
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is missing. Create a WRITE token at"
            echo "  https://huggingface.co/settings/tokens"
            echo "then add it as a repository secret named HF_TOKEN at"
            echo "  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✓ HF_TOKEN present"

      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          HF_URL="https://${HF_OWNER}:${HF_TOKEN}@huggingface.co/spaces/${HF_OWNER}/${HF_SPACE_NAME}"
          git remote add hf "$HF_URL"
          # HF's pre-receive REJECTS plain-git binaries ("use xet/LFS to store
          # binary files"). Our only binary is the README demo screenshot under
          # assets/, which the runtime Space doesn't need — the rendered README
          # loads it from the GitHub raw URL instead. Rather than adopt LFS just
          # to satisfy the mirror, deploy a single flattened snapshot of main
          # with assets/ excluded. GitHub main stays the full source of truth;
          # the HF mirror carries everything required to build the Docker Space.
          # --force is deliberate: the Space is a deployed mirror, not a dev line.
          git checkout --orphan hf-mirror
          # --ignore-unmatch keeps the deploy idempotent: if assets/ is ever
          # removed or renamed, `git rm` would otherwise exit 128 and (under
          # set -euo pipefail) break every deploy. Nothing-to-exclude is fine.
          git rm -r --cached --quiet --ignore-unmatch assets
          git commit --quiet -m "Deploy ${GITHUB_SHA} — HF runtime mirror (assets/ excluded)"
          git push --force hf hf-mirror:main
          echo "✓ Deployed to https://huggingface.co/spaces/${HF_OWNER}/${HF_SPACE_NAME}"

      - name: Summary
        run: |
          echo "### Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Space: [${HF_OWNER}/${HF_SPACE_NAME}](https://huggingface.co/spaces/${HF_OWNER}/${HF_SPACE_NAME})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build status: watch the Space page — Docker rebuild takes ~5-10 min on first deploy, ~2 min after." >> "$GITHUB_STEP_SUMMARY"

  space-health:
    name: Live Space is up (scheduled probe)
    runs-on: ubuntu-latest
    # The Streamlit app is the only public surface (the API is in-process), so an
    # external probe can't inspect the banner — but it CAN confirm the demo is
    # reachable. A red run here is the honest signal that the advertised live
    # demo is down/crashed, the observability the pull-only app can't emit itself.
    if: github.event_name == 'schedule'
    timeout-minutes: 5
    steps:
      - name: Probe the live Space
        run: |
          set -euo pipefail
          owner_lc="$(printf '%s' "$HF_OWNER" | tr '[:upper:]' '[:lower:]')"
          url="https://${owner_lc}-${HF_SPACE_NAME}.hf.space/"
          echo "Probing ${url}"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 30 "$url" || echo 000)"
          if [ "$code" != "200" ]; then
            echo "::error::Live Space health check failed — GET ${url} returned ${code} (expected 200). The public demo is down or crashed."
            exit 1
          fi
          echo "Space healthy (HTTP 200)"
