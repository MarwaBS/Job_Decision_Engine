# Dependabot configuration for Job Decision Engine.
#
# Three ecosystems monitored — same hygiene pattern as the rest of the
# portfolio (nyc-real-estate-predictor, high-pay-salary-predictor and a
# private project). Dependabot opens weekly PRs for outdated or
# CVE-affected dependencies; nothing auto-merges.
#
# - pip            -> requirements.txt (production runtime + test deps)
# - github-actions -> versions in .github/workflows/*.yml
# - docker         -> base image in Dockerfile
#
# Config reference:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Direct only. pip scans every requirements*.txt, so without this it edits
    # single pins inside requirements-lock.txt, which CI feeds to pip as a
    # constraints file. Bumping one resolved entry contradicts the direct pin
    # that produced it and the install fails with ResolutionImpossible. A lock
    # is regenerated whole, never patched a line at a time.
    allow:
      - dependency-type: "direct"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(docker)"
